# Arthas 服务端配置（挂载到容器 /opt/arthas/arthas.properties）
# 官方文档：https://arthas.aliyun.com/doc/

# 监听地址：容器使用 host 网络，0.0.0.0 才能被宿主机/隧道访问
arthas.ip=0.0.0.0

# telnet 终端端口 / http 控制台端口
arthas.telnetPort=3658
arthas.httpPort=8563

# 会话超时（秒）
arthas.sessionTimeout=10800

# 远程访问必须开启认证，否则任何人拿到 IP 即可操作 JVM
arthas.username=admin
arthas.password=arthas123

# 本机回环连接免认证（便于在服务器上用 telnet 本机调试）
arthas.localConnectionNonAuth=true
