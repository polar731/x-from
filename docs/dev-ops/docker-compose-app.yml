version: '3.8'

# X-From 表单服务 + 前端（课程演示服务器）
# 启动：docker compose -f docker-compose-app.yml up -d
# 运营端：http://111.228.23.102:8088/admin/
# 用户端：http://111.228.23.102:8088/user/index.html?formNo=xxxx
#
# 说明：
#  1) 容器使用 host 网络，宿主机上 MySQL(13306)/Redis(16379) 由 docker-proxy 暴露，
#     因此 prod 配置走 127.0.0.1（公网 IP 回环在本机被 NAT 拦截，不可用）。
#  2) SPRING_PROFILES_ACTIVE 用环境变量下发，避免命令行折叠写法丢失参数。

services:
  x-from-app:
    image: docker.1panel.live/library/eclipse-temurin:17-jre
    container_name: x-from-app
    restart: always
    network_mode: host
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./app/x-from-app.jar:/app/x-from-app.jar
      # logback 配置的日志文件为 ./data/log/log_info.log（相对工作目录 /app），
      # 因此必须映射 /app/data/log，映射 /app/log 是拿不到日志的。
      - ./data/log:/app/data/log
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -Duser.timezone=Asia/Shanghai
      - -jar
      - /app/x-from-app.jar
      - --server.port=8091

  x-from-nginx:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/nginx:1.25.1
    container_name: x-from-nginx
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - x-from-app
